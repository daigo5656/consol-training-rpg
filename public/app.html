<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新人ディレクター育成RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .animate-confetti { position: absolute; animation: confetti linear forwards; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes bounce-in {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

    .level-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .2; }
      50% { opacity: .5; }
    }

    /* モーダル */
    .modal-backdrop {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 selection:bg-indigo-100">

  <!-- ローディング -->
  <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
    <div class="text-center">
      <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-xl mx-auto mb-4 animate-pulse">
        <span class="font-bold text-2xl">D</span>
      </div>
      <p class="text-slate-500 text-sm">読み込み中...</p>
    </div>
  </div>

  <!-- 通知エリア -->
  <div id="notification-area" class="fixed top-4 right-4 z-50 pointer-events-none"></div>
  <!-- 紙吹雪エリア -->
  <div id="confetti-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- メモモーダル -->
  <div id="memo-modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-indigo-50 to-purple-50">
        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="sword" width="20" class="text-indigo-500"></i>
          クエスト完了！
        </h3>
        <p id="memo-skill-name" class="text-sm text-slate-500 mt-1"></p>
      </div>
      <div class="p-6">
        <label class="block text-sm font-bold text-slate-700 mb-2">振り返りメモ（任意）</label>
        <textarea id="memo-text" rows="3" placeholder="学んだこと、気づいたことを記録..."
          class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
      </div>
      <div class="p-4 border-t border-slate-100 flex gap-3">
        <button onclick="cancelMemo()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition-all">
          キャンセル
        </button>
        <button onclick="confirmComplete()" class="flex-1 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-500 to-purple-600 shadow-lg hover:shadow-xl hover:brightness-110 transition-all transform active:scale-95">
          達成！
        </button>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <!-- プレイヤー情報 -->
        <div class="flex items-center gap-4">
          <div class="relative">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-lg transform rotate-3">
              <span id="user-initial" class="font-bold text-2xl">D</span>
            </div>
            <div class="absolute -bottom-2 -right-2 w-12 h-12 flex items-center justify-center">
              <div class="absolute inset-0 bg-yellow-400 rounded-full opacity-20 level-pulse"></div>
              <div class="relative z-10 flex flex-col items-center justify-center w-10 h-10 bg-gradient-to-br from-yellow-300 to-amber-500 rounded-full shadow-lg border-2 border-white">
                <span class="text-[10px] font-bold text-amber-900 leading-none">LV</span>
                <span id="total-level" class="text-lg font-black text-white leading-none">1</span>
              </div>
            </div>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 id="user-name" class="text-xl font-bold text-slate-900">読み込み中...</h1>
              <span id="user-rank" class="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-200">
                L1 基礎学習中
              </span>
            </div>
            <div class="flex items-center gap-4 mt-1 text-sm text-slate-500">
              <span class="flex items-center gap-1"><i data-lucide="target" width="14"></i>
                <span id="user-dept">コンテンツソリューション部</span></span>
              <span class="flex items-center gap-1"><i data-lucide="award" width="14"></i> クエスト達成: <span id="completed-count">0</span>/<span id="total-count">0</span></span>
            </div>
          </div>
        </div>

        <!-- 右側ボタン群 -->
        <div class="flex items-center gap-3">
          <div id="pc-status-bar" class="hidden md:flex gap-6 bg-slate-50 px-6 py-3 rounded-xl border border-slate-100"></div>
          <div class="flex gap-2">
            <a id="admin-link" href="/admin.html" class="hidden px-3 py-2 bg-amber-100 text-amber-700 rounded-lg text-sm font-bold hover:bg-amber-200 transition-all flex items-center gap-1">
              <i data-lucide="settings" width="14"></i> 管理
            </a>
            <button onclick="handleLogout()" class="px-3 py-2 bg-slate-100 text-slate-500 rounded-lg text-sm font-bold hover:bg-slate-200 transition-all flex items-center gap-1">
              <i data-lucide="log-out" width="14"></i> ログアウト
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- モバイル用ステータス -->
    <div id="mobile-status-grid" class="md:hidden grid grid-cols-2 gap-3 mb-8"></div>

    <!-- ページタブ（クエスト / リーダーボード / バッジ） -->
    <div class="flex gap-2 mb-6 border-b border-slate-200 pb-3">
      <button onclick="switchPage('quests')" id="page-quests"
        class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-slate-800 text-white">
        <i data-lucide="swords" width="14" class="inline mr-1"></i>クエスト
      </button>
      <button onclick="switchPage('leaderboard')" id="page-leaderboard"
        class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-slate-500 hover:bg-slate-100">
        <i data-lucide="trophy" width="14" class="inline mr-1"></i>ランキング
      </button>
      <button onclick="switchPage('badges')" id="page-badges"
        class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-slate-500 hover:bg-slate-100">
        <i data-lucide="medal" width="14" class="inline mr-1"></i>バッジ
      </button>
    </div>

    <!-- クエストページ -->
    <div id="view-quests">
      <div id="filter-tabs" class="flex overflow-x-auto pb-4 gap-2 mb-6 scrollbar-hide"></div>
      <div id="quest-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- リーダーボードページ -->
    <div id="view-leaderboard" class="hidden">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-yellow-50 to-amber-50">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="trophy" width="20" class="text-amber-500"></i>
            XPランキング
          </h2>
        </div>
        <div id="leaderboard-list" class="divide-y divide-slate-100"></div>
      </div>
    </div>

    <!-- バッジページ -->
    <div id="view-badges" class="hidden">
      <!-- レーダーチャート -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="radar" width="20" class="text-indigo-500"></i>
          スキルマップ
        </h2>
        <div class="flex justify-center">
          <svg id="radar-chart" width="300" height="300" viewBox="0 0 300 300"></svg>
        </div>
      </div>
      <!-- バッジ一覧 -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="medal" width="20" class="text-purple-500"></i>
            獲得バッジ
          </h2>
        </div>
        <div id="badge-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 p-6"></div>
      </div>
    </div>
  </main>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/skill-data.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
