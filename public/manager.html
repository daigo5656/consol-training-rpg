<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マネージャー画面 - 新人ディレクター育成RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .modal-backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
    .status-pending { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
    .status-approved { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
    .status-rejected { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-emerald-50/30 text-slate-800">

  <!-- ローディング -->
  <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-slate-50 to-emerald-50 z-[100] flex items-center justify-center">
    <div class="text-center">
      <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-3xl flex items-center justify-center text-white shadow-2xl mx-auto mb-6 animate-pulse">
        <i data-lucide="users" width="28"></i>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 bg-emerald-400 rounded-full animate-bounce" style="animation-delay:0s"></div>
        <div class="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style="animation-delay:0.15s"></div>
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style="animation-delay:0.3s"></div>
      </div>
    </div>
  </div>

  <!-- 承認モーダル -->
  <div id="review-modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in max-h-[85vh] overflow-y-auto">
      <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-emerald-50 to-teal-50 sticky top-0 z-10">
        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <div class="w-8 h-8 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-lg flex items-center justify-center">
            <i data-lucide="clipboard-check" width="16" class="text-white"></i>
          </div>
          クエスト申請レビュー
        </h3>
      </div>
      <div id="review-content" class="p-6 space-y-4"></div>
      <div class="p-4 border-t border-slate-100 bg-slate-50/50 sticky bottom-0 space-y-3">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">フィードバック（任意）</label>
          <textarea id="review-feedback" rows="2" placeholder="メンバーへのコメント..."
            class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300 resize-none transition-all text-sm"></textarea>
        </div>
        <div class="flex gap-3">
          <button onclick="closeReview()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-white border border-slate-200 hover:bg-slate-50 transition-all text-sm">
            閉じる
          </button>
          <button onclick="rejectQuest()" class="flex-1 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-red-500 to-rose-500 shadow-lg hover:brightness-110 transition-all transform active:scale-[0.98] text-sm flex items-center justify-center gap-1.5">
            <i data-lucide="x-circle" width="16"></i> 差し戻し
          </button>
          <button onclick="approveQuest()" class="flex-1 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-500 shadow-lg hover:brightness-110 transition-all transform active:scale-[0.98] text-sm flex items-center justify-center gap-1.5">
            <i data-lucide="check-circle" width="16"></i> 承認
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200/50 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-lg">
          <i data-lucide="users" width="22"></i>
        </div>
        <div>
          <h1 class="text-lg font-black text-slate-800">マネージャーダッシュボード</h1>
          <p class="text-xs text-slate-400">メンバー進捗管理・クエスト承認</p>
        </div>
      </div>
      <div class="flex gap-2">
        <a href="/app.html" class="px-4 py-2.5 bg-gradient-to-r from-indigo-50 to-purple-50 text-indigo-700 rounded-xl text-sm font-bold hover:shadow-md transition-all flex items-center gap-1.5 border border-indigo-200/50">
          <i data-lucide="arrow-left" width="14"></i> アプリ
        </a>
        <button onclick="handleLogout()" class="px-3 py-2.5 bg-slate-100 text-slate-400 rounded-xl text-sm font-bold hover:bg-slate-200 transition-all">
          <i data-lucide="log-out" width="14"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- 統計 -->
    <div id="manager-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

    <!-- タブ -->
    <div class="flex gap-2 mb-6">
      <button onclick="switchManagerTab('pending')" id="mtab-pending" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-amber-500 text-white shadow-md flex items-center gap-1.5">
        <i data-lucide="clock" width="14"></i> 承認待ち <span id="pending-count-badge" class="bg-white/30 px-1.5 py-0.5 rounded-full text-[10px] ml-1">0</span>
      </button>
      <button onclick="switchManagerTab('members')" id="mtab-members" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-slate-400 border border-slate-200/50 flex items-center gap-1.5">
        <i data-lucide="users" width="14"></i> メンバー一覧
      </button>
      <button onclick="switchManagerTab('history')" id="mtab-history" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-slate-400 border border-slate-200/50 flex items-center gap-1.5">
        <i data-lucide="history" width="14"></i> 承認履歴
      </button>
    </div>

    <!-- 承認待ちリスト -->
    <div id="view-pending"></div>
    <!-- メンバー一覧 -->
    <div id="view-members" class="hidden"></div>
    <!-- 承認履歴 -->
    <div id="view-history" class="hidden"></div>
  </main>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/skill-data.js"></script>
  <script src="/js/manager.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
