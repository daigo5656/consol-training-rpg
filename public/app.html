<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新人ディレクター育成RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .animate-confetti { position: absolute; animation: confetti linear forwards; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes bounce-in {
      0% { transform: translateX(100%) scale(0.8); opacity: 0; }
      60% { transform: translateX(-5%) scale(1.02); opacity: 1; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }

    .level-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: .5; } }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #a855f7, #6366f1);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .modal-backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
    .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); }

    .card-hover { transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }

    .status-pending { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
    .status-approved { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
    .status-rejected { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-indigo-50/30 text-slate-800 selection:bg-indigo-100">

  <!-- ローディング -->
  <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-slate-50 to-indigo-50 z-[100] flex items-center justify-center">
    <div class="text-center">
      <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-3xl flex items-center justify-center text-white shadow-2xl mx-auto mb-6 animate-pulse">
        <span class="font-black text-3xl">D</span>
      </div>
      <div class="flex items-center gap-2 text-slate-400">
        <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay:0s"></div>
        <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:0.15s"></div>
        <div class="w-2 h-2 bg-pink-400 rounded-full animate-bounce" style="animation-delay:0.3s"></div>
      </div>
    </div>
  </div>

  <!-- 通知エリア -->
  <div id="notification-area" class="fixed top-4 right-4 z-50 pointer-events-none space-y-3" style="max-width:380px"></div>
  <!-- 紙吹雪エリア -->
  <div id="confetti-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- 申請モーダル -->
  <div id="memo-modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in">
      <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-lg flex items-center justify-center">
            <i data-lucide="send" width="16" class="text-white"></i>
          </div>
          クエスト完了申請
        </h3>
        <p id="memo-skill-name" class="text-sm text-slate-500 mt-1 ml-10"></p>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">振り返りメモ</label>
          <textarea id="memo-text" rows="3" placeholder="学んだこと、気づいたことを記録..."
            class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none transition-all"></textarea>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">エビデンス画像（任意）</label>
          <div id="image-drop-zone" class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-indigo-300 hover:bg-indigo-50/30 transition-all cursor-pointer">
            <input type="file" id="evidence-file" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            <div id="image-preview-area">
              <i data-lucide="image-plus" width="32" class="mx-auto text-slate-300 mb-2"></i>
              <p class="text-sm text-slate-400">クリックまたはドラッグ&ドロップ</p>
              <p class="text-xs text-slate-300 mt-1">JPG, PNG, GIF (最大5MB)</p>
            </div>
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100 bg-slate-50/50 flex gap-3">
        <button onclick="cancelMemo()" class="flex-1 py-3 rounded-xl font-bold text-slate-500 bg-white border border-slate-200 hover:bg-slate-50 transition-all">
          キャンセル
        </button>
        <button onclick="confirmComplete()" id="submit-quest-btn" class="flex-1 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-500 to-purple-500 shadow-lg hover:shadow-xl hover:brightness-110 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
          <i data-lucide="send" width="16"></i> 申請する
        </button>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200/50 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="relative">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-white shadow-lg transform rotate-3">
              <span id="user-initial" class="font-black text-2xl drop-shadow">D</span>
            </div>
            <div class="absolute -bottom-2 -right-2 w-12 h-12 flex items-center justify-center">
              <div class="absolute inset-0 bg-yellow-400 rounded-full opacity-20 level-pulse"></div>
              <div class="relative z-10 flex flex-col items-center justify-center w-10 h-10 bg-gradient-to-br from-yellow-300 to-amber-500 rounded-full shadow-lg border-2 border-white">
                <span class="text-[8px] font-bold text-amber-900 leading-none">LV</span>
                <span id="total-level" class="text-lg font-black text-white leading-none">1</span>
              </div>
            </div>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h1 id="user-name" class="text-xl font-black text-slate-900">読み込み中...</h1>
              <span id="user-rank" class="px-2.5 py-0.5 bg-gradient-to-r from-indigo-100 to-purple-100 text-indigo-700 text-xs font-bold rounded-full border border-indigo-200/50">
                L1 基礎学習中
              </span>
            </div>
            <div class="flex items-center gap-4 mt-1 text-sm text-slate-400">
              <span class="flex items-center gap-1"><i data-lucide="building-2" width="14"></i>
                <span id="user-dept">コンテンツソリューション部</span></span>
              <span class="flex items-center gap-1"><i data-lucide="award" width="14"></i>
                <span id="completed-count">0</span>/<span id="total-count">0</span> 達成</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="pc-status-bar" class="hidden md:flex gap-5 bg-slate-50/80 px-5 py-3 rounded-2xl border border-slate-100"></div>
          <div class="flex gap-2">
            <a id="manager-link" href="/manager.html" class="hidden px-3 py-2 bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-700 rounded-xl text-sm font-bold hover:shadow-md transition-all items-center gap-1.5 border border-emerald-200/50">
              <i data-lucide="users" width="14"></i> マネージャー
            </a>
            <a id="admin-link" href="/admin.html" class="hidden px-3 py-2 bg-gradient-to-r from-amber-50 to-orange-50 text-amber-700 rounded-xl text-sm font-bold hover:shadow-md transition-all items-center gap-1.5 border border-amber-200/50">
              <i data-lucide="shield" width="14"></i> 管理
            </a>
            <button onclick="handleLogout()" class="px-3 py-2 bg-slate-100 text-slate-400 rounded-xl text-sm font-bold hover:bg-slate-200 transition-all flex items-center gap-1">
              <i data-lucide="log-out" width="14"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="mobile-status-grid" class="md:hidden grid grid-cols-2 gap-3 mb-8"></div>

    <!-- ページタブ -->
    <div class="flex gap-2 mb-6 border-b border-slate-200/50 pb-3">
      <button onclick="switchPage('quests')" id="page-quests"
        class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-slate-800 text-white shadow-md">
        <i data-lucide="swords" width="14" class="inline mr-1"></i>クエスト
      </button>
      <button onclick="switchPage('leaderboard')" id="page-leaderboard"
        class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-slate-400 hover:bg-slate-50 border border-slate-200/50">
        <i data-lucide="trophy" width="14" class="inline mr-1"></i>ランキング
      </button>
      <button onclick="switchPage('badges')" id="page-badges"
        class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white text-slate-400 hover:bg-slate-50 border border-slate-200/50">
        <i data-lucide="medal" width="14" class="inline mr-1"></i>バッジ
      </button>
    </div>

    <!-- クエストページ -->
    <div id="view-quests">
      <div id="filter-tabs" class="flex overflow-x-auto pb-4 gap-2 mb-6 scrollbar-hide"></div>
      <div id="quest-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- リーダーボード -->
    <div id="view-leaderboard" class="hidden">
      <div class="bg-white rounded-3xl border border-slate-200/50 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-yellow-50 to-amber-50">
          <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
            <i data-lucide="trophy" width="20" class="text-amber-500"></i>
            XPランキング
          </h2>
          <p class="text-xs text-amber-600/60 mt-1">承認済みクエストのXPのみカウント</p>
        </div>
        <div id="leaderboard-list" class="divide-y divide-slate-100"></div>
      </div>
    </div>

    <!-- バッジ -->
    <div id="view-badges" class="hidden">
      <div class="bg-white rounded-3xl border border-slate-200/50 shadow-sm p-6 mb-6">
        <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
          <i data-lucide="radar" width="20" class="text-indigo-500"></i>
          スキルマップ
        </h2>
        <div class="flex justify-center"><svg id="radar-chart" width="300" height="300" viewBox="0 0 300 300"></svg></div>
      </div>
      <div class="bg-white rounded-3xl border border-slate-200/50 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100">
          <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
            <i data-lucide="medal" width="20" class="text-purple-500"></i> 獲得バッジ
          </h2>
        </div>
        <div id="badge-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 p-6"></div>
      </div>
    </div>
  </main>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/skill-data.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
