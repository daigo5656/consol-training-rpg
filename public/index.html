<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 新人ディレクター育成RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- ロゴ -->
    <div class="text-center mb-8 animate-float">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl shadow-xl transform rotate-3 mb-4">
        <span class="font-black text-4xl text-white">D</span>
      </div>
      <h1 class="text-2xl font-black text-slate-800">新人ディレクター育成RPG</h1>
      <p class="text-sm text-slate-500 mt-1">コンテンツソリューション部</p>
    </div>

    <!-- カード -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <!-- タブ -->
      <div class="flex border-b border-slate-200">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-3 text-sm font-bold text-center transition-colors border-b-2 border-indigo-500 text-indigo-600">
          ログイン
        </button>
        <button id="tab-signup" onclick="switchTab('signup')"
          class="flex-1 py-3 text-sm font-bold text-center transition-colors border-b-2 border-transparent text-slate-400 hover:text-slate-600">
          新規登録
        </button>
      </div>

      <div class="p-6">
        <!-- エラー表示 -->
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600"></div>
        <!-- 成功表示 -->
        <div id="success-msg" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-600"></div>

        <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
          <!-- 名前（新規登録のみ） -->
          <div id="name-field" class="hidden">
            <label class="block text-sm font-bold text-slate-700 mb-1">表示名</label>
            <input id="display-name" type="text" placeholder="山田 太郎"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all">
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">メールアドレス</label>
            <input id="email" type="email" required placeholder="you@example.com"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all">
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">パスワード</label>
            <input id="password" type="password" required placeholder="6文字以上" minlength="6"
              class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all">
          </div>

          <button type="submit" id="submit-btn"
            class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl hover:brightness-110 transition-all transform active:scale-95 flex items-center justify-center gap-2">
            <i data-lucide="log-in" width="18"></i>
            <span id="submit-text">ログイン</span>
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">&copy; コンテンツソリューション部 Training System</p>
  </div>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
